[project]
name = "roommind-sim"
version = "0.1.0"
description = "Simulated home + controllable clock for testing RoomMind in a real Home Assistant"
requires-python = ">=3.13"
dependencies = ["pyyaml"]

[project.optional-dependencies]
ui = ["playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PLC", "PLE", "PLW"]
ignore = ["E501", "PLC0415"]
