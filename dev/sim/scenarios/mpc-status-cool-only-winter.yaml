name: mpc-status-cool-only-winter
description: >
  Winter, a cool-only office with a split AC next to a heated living room. The outdoor
  limit keeps the office from cooling, so it never collects cooling data; it must not
  report MPC as active (only its idle data was checked before). The living room heats
  and reaches MPC as usual.
tags: [ac, trv, mpc, outdoor-gate]
start: 2026-01-12T00:00
duration: 2d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    wohnzimmer:
      floor_area_m2: 30
      initial: {temperature: 19.0}
      windows: [{orientation: S, area_m2: 4}]
      devices:
        - {entity_id: climate.wz_trv, profile: generic_trv}
        - {entity_id: climate.kessel, profile: generic_boiler, initial_mode: heat}
      sensors: {temperature: {entity_id: sensor.wz_temp}}
    buero:
      floor_area_m2: 12
      initial: {temperature: 17.0}
      windows: [{orientation: W, area_m2: 2}]
      devices: [{entity_id: climate.buero_split, profile: generic_split_ac}]
      sensors: {temperature: {entity_id: sensor.buero_temp}}
helpers:
  schedule:
    tag: {daily: ["06:00-22:30"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
  rooms:
    wohnzimmer:
      devices: [{entity_id: climate.wz_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.wz_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.tag}]
      comfort_temp: 21.0
      eco_temp: 18.0
    buero:
      devices: [{entity_id: climate.buero_split, type: ac}]
      temperature_sensor: sensor.buero_temp
      climate_mode: cool_only
      comfort_temp: 24.0
      eco_temp: 27.0
expect:
  - {invariant: target_never_empty}
  - {invariant: no_cooling_below_outdoor_min}
  - {metric: device.active_h, entity_id: climate.buero_split, max: 0, label: the office never cools in winter}
  - {check: "room.buero.mpc_active == false", at: "+1d", label: office without cooling data is not on MPC}
  - {check: "room.buero.mpc_active == false", at: "+1d23h", label: office still not on MPC}
  - {check: "room.wohnzimmer.mpc_active == true", at: "+1d23h", label: the heated room reaches MPC}
