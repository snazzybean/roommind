name: room-fan-heating
description: >
  RoomMind runs a room fan while it heats (#266). Three identical radiator rooms with the same
  schedule: Raum A has a ceiling fan (fan.*, speed set to 67 % by the user), Raum B a standing
  fan on a smart plug (switch.*), Raum C none (reference). The fans run while the room heats
  and after a run while the radiator still gives off heat, at the speed the user chose. Day 3:
  a hand switches fan B off during the morning heating (stays off until the run is over), then
  on at noon with no heating (RoomMind leaves it running) and off again at 15:00.
tags: [trv, appliances, room-fan]
refs: [266]
start: 2026-01-12T00:00
duration: 5d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    raum_a:
      name: Raum A
      floor_area_m2: 18
      exterior_wall_m2: 10
      initial: {temperature: 19.0}
      windows: [{orientation: N, area_m2: 1.8}]
      devices: [{entity_id: climate.raum_a_trv, profile: generic_trv}]
      appliances: [{entity_id: fan.raum_a_decke, profile: ceiling_fan, initial_percentage: 67}]
      sensors: {temperature: {entity_id: sensor.raum_a_temp}}
    raum_b:
      name: Raum B
      floor_area_m2: 18
      exterior_wall_m2: 10
      initial: {temperature: 19.0}
      windows: [{orientation: N, area_m2: 1.8}]
      devices: [{entity_id: climate.raum_b_trv, profile: generic_trv}]
      appliances: [{entity_id: switch.raum_b_ventilator, profile: ceiling_fan, power_w: 50}]
      sensors: {temperature: {entity_id: sensor.raum_b_temp}}
    raum_c:
      name: Raum C
      floor_area_m2: 18
      exterior_wall_m2: 10
      initial: {temperature: 19.0}
      windows: [{orientation: N, area_m2: 1.8}]
      devices: [{entity_id: climate.raum_c_trv, profile: generic_trv}]
      sensors: {temperature: {entity_id: sensor.raum_c_temp}}
helpers:
  schedule:
    plan: {weekdays: ["06:00-08:00", "17:00-22:00"], weekend: ["08:00-22:00"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
  rooms:
    raum_c: &room
      devices: [{entity_id: climate.raum_c_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.raum_c_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan}]
      comfort_temp: 21.0
      eco_temp: 18.0
    raum_a:
      <<: *room
      devices: [{entity_id: climate.raum_a_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.raum_a_temp
      room_fan_entity: fan.raum_a_decke
    raum_b:
      <<: *room
      devices: [{entity_id: climate.raum_b_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.raum_b_temp
      room_fan_entity: switch.raum_b_ventilator
      room_fan_mode: heat
timeline:
  - {at: "+2d06h20m", do: device.manual, entity_id: switch.raum_b_ventilator, state: "off"}
  - {at: "+2d12h", do: device.manual, entity_id: switch.raum_b_ventilator, state: "on"}
  - {at: "+2d15h", do: device.manual, entity_id: switch.raum_b_ventilator, state: "off"}
expect:
  - {metric: appliance.rejected_commands, entity_id: fan.raum_a_decke, max: 0}
  - {metric: appliance.rejected_commands, entity_id: switch.raum_b_ventilator, max: 0}
  - {metric: appliance.shortest_run_min, entity_id: fan.raum_a_decke, min: 10}
  - {metric: appliance.starts, entity_id: fan.raum_a_decke, min: 5}
  - {check: "room.raum_a.room_fan_active == (state('fan.raum_a_decke') == 'on')", at: "+1d06h30m", label: fan A follows RoomMind}
  - {check: "appliance('fan.raum_a_decke').pct == 67", at: "+4d", label: speed stays as the user set it}
  - {check: "state('switch.raum_b_ventilator') == 'off'", at: "+2d06h40m", label: hand-off holds while heating}
  - {check: "state('switch.raum_b_ventilator') == 'on'", at: "+2d14h50m", label: hand-on is not fought}
  - {check: "state('switch.raum_b_ventilator') == 'off'", at: "+2d15h05m", label: hand-off of a fan running by hand holds}
  - {metric: appliance.starts, entity_id: fan.raum_a_decke, max: 40}
  - {metric: device.restarts_10min, entity_id: climate.raum_a_trv, max: 15}
