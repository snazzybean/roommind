name: ir-ac-no-feedback
description: >
  IR-controlled split AC without state feedback. Every frame beeps, so RoomMind must
  not resend unchanged commands (#416, #298).
refs: [416, 298]
tags: [ac, commands]
start: 2026-01-12T00:00
duration: 2d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    wohnzimmer:
      floor_area_m2: 24
      initial: {temperature: 19.0}
      windows: [{orientation: S, area_m2: 3}]
      devices: [{entity_id: climate.wz_ir_ac, profile: broadlink_ir_ac}]
      sensors: {temperature: {entity_id: sensor.wz_temp}}
helpers:
  schedule:
    tag: {daily: ["06:30-22:30"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    control_mode: mpc
  rooms:
    wohnzimmer:
      devices: [{entity_id: climate.wz_ir_ac, type: ac}]
      temperature_sensor: sensor.wz_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.tag}]
      comfort_temp: 21.0
      eco_temp: 18.0
expect:
  - {metric: device.commands_per_hour, entity_id: climate.wz_ir_ac, max: 3, known_failure: 'candidate: controller heats up to the hard ceiling (target +1 K), gets suppressed, heats again next cycle (~45 cmds/h); same with control_mode=bangbang (setting is not read by the backend), without sensor noise, at 1.2 kW and on v1.7.7. Likely fast air-node dynamics of AC heating vs the 1-node model (#128/#316 pattern); strength depends on the air/mass calibration of the simulation'}
  - {metric: device.redundant_commands, entity_id: climate.wz_ir_ac, max: 0}
  - {invariant: max_commands_per_hour, entity_id: climate.wz_ir_ac, limit: 10, known_failure: 'candidate: controller heats up to the hard ceiling (target +1 K), gets suppressed, heats again next cycle (~45 cmds/h); same with control_mode=bangbang (setting is not read by the backend), without sensor noise, at 1.2 kW and on v1.7.7. Likely fast air-node dynamics of AC heating vs the 1-node model (#128/#316 pattern); strength depends on the air/mass calibration of the simulation'}
