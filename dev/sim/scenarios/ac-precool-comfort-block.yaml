name: ac-precool-comfort-block
description: >
  North-facing living room with a small split AC (1.5 kW) in a hot summer week. Eco 27 °C
  during the day, comfort 24 °C from 18:00. The greedy plan sees the lower target only
  30 min ahead, so the room reached 24 °C about an hour into the block (25.5 °C at 18:00).
  The pre-cool deadline (mirror of the pre-heat deadline) starts early enough to be near
  the comfort target when the block begins.
refs: [450]
tags: [ac, mpc, schedule]
start: 2026-07-06T00:00
duration: 5d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: hot-summer}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    wohnzimmer:
      floor_area_m2: 24
      initial: {temperature: 26.0, mass_temperature: 26.0}
      windows: [{orientation: N, area_m2: 3, g_value: 0.6}]
      devices: [{entity_id: climate.wz_ac, profile: generic_split_ac, cool_capacity_w: 1500}]
      sensors:
        temperature: {entity_id: sensor.wz_temp}
helpers:
  schedule:
    abend: {daily: ["18:00-23:00"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
  rooms:
    wohnzimmer:
      devices: [{entity_id: climate.wz_ac, type: ac}]
      temperature_sensor: sensor.wz_temp
      climate_mode: cool_only
      schedules: [{entity_id: schedule.abend}]
      comfort_cool: 24.0
      eco_cool: 27.0
expect:
  - {invariant: no_rejected_commands}
  - {invariant: min_run_respected}
  # Days 3-5 (the model needs two days of cooling before MPC runs). Before the pre-cool
  # deadline 25.3 °C at 18:00 (start at 17:30); after it the run starts 2-4 h ahead at 27 °C
  # and reads 24.2-24.4 °C at 18:00, in band 92.5 -> 99.7 %, energy +5 %, starts +8 %.
  - {check: "room.wohnzimmer.current_temp <= 24.5", at: "+2d18h05m", label: near comfort when the block starts (day 3)}
  - {check: "room.wohnzimmer.current_temp <= 24.5", at: "+3d18h05m", label: near comfort when the block starts (day 4)}
  - {check: "room.wohnzimmer.current_temp <= 24.5", at: "+4d18h05m", label: near comfort when the block starts (day 5)}
