name: boiler-master-monitor-only
description: >
  A room can call for heat while a boiler controller remains off. Monitor-only
  mode keeps the boiler in charge and records no delivered heat for the room.
tags: [trv, boiler, monitor]
start: 2026-01-12T00:00
duration: 1d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    wohnzimmer:
      name: Wohnzimmer
      floor_area_m2: 22
      exterior_wall_m2: 12
      initial: {temperature: 17.0}
      devices:
        - {entity_id: climate.wohnzimmer_trv, profile: generic_trv}
        - {entity_id: climate.heizung_kessel, profile: generic_boiler, initial_mode: off}
      sensors:
        temperature: {entity_id: sensor.wohnzimmer_temp}
helpers:
  schedule:
    room_heating: {daily: ["00:00-23:59"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
    compressor_groups:
      - id: kessel
        name: Kessel
        members: [climate.wohnzimmer_trv]
        master_entity: climate.heizung_kessel
        master_control_mode: monitor
        min_run_minutes: 5
        min_off_minutes: 5
  rooms:
    wohnzimmer:
      devices: [{entity_id: climate.wohnzimmer_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.wohnzimmer_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.room_heating}]
      comfort_temp: 21.0
      eco_temp: 18.0
expect:
  - {check: "room.wohnzimmer.commanded_mode == 'heating'", at: "+0d02h00m", label: zone calls for heat}
  - {metric: device.active_h, entity_id: climate.heizung_kessel, max: 0, label: monitor-only boiler is not commanded}
