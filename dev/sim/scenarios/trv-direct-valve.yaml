name: trv-direct-valve
description: >
  One living room with a gas boiler and a Sonoff TRVZB that RoomMind drives through its
  valve opening/closing degree number entities (direct valve control) instead of the
  setpoint. A running room holds the valve at the opening it needs instead of switching
  a boosted setpoint on and off: longer runs, fewer boiler starts, less valve travel.
refs: [413]
tags: [trv, mpc, direct-valve]
start: 2026-01-12T00:00
duration: 7d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor:
    sensors:
      temperature: sensor.aussen_temp
      humidity: sensor.aussen_feuchte
  rooms:
    wohnzimmer:
      name: Wohnzimmer
      floor_area_m2: 28
      exterior_wall_m2: 16
      initial: {temperature: 20.0}
      windows: [{orientation: S, area_m2: 3.5}]
      devices:
        # Concave valve: most of the flow at a small opening, as on real thermostatic valves
        - {entity_id: climate.wz_trv, profile: sonoff_trvzb, valve_flow_exponent: 0.6}
        - {entity_id: climate.heizung_kessel, profile: generic_boiler}
      sensors:
        # 0.2 K steps: one step moves the valve demand by 20 %
        temperature: {entity_id: sensor.wohnzimmer_temp, profile: sonoff_snzb02d}
helpers:
  schedule:
    plan_wohnen: {weekdays: ["06:00-08:00", "16:30-22:30"], weekend: ["07:30-23:00"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    outdoor_humidity_sensor: sensor.aussen_feuchte
    weather_entity: weather.simhome
    control_mode: mpc
    compressor_groups:
      - id: kessel
        name: Kessel
        members: [climate.wz_trv]
        master_entity: climate.heizung_kessel
        min_run_minutes: 5
        min_off_minutes: 5
  rooms:
    wohnzimmer:
      devices:
        - entity_id: climate.wz_trv
          type: trv
          heating_system_type: radiator
          valve_opening_entity: number.wz_trv_valve_opening_degree
          valve_closing_entity: number.wz_trv_valve_closing_degree
      temperature_sensor: sensor.wohnzimmer_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan_wohnen}]
      comfort_temp: 21.0
      eco_temp: 18.0
expect:
  - {invariant: no_rejected_commands}
  # Same room on the boosted setpoint (devices without the valve entities), 7 d, seeds 1/2:
  # in band 89.3/92.9 %, 11.0/17.1 starts/day, valve travel 22.1/34.3 strokes/day.
  # Valve control 2026-10-19, seed 1: 91.4 %, 3.0 starts/day, 7.5 strokes/day,
  # 2.2 number commands/h (two per move); seed 2 earlier: 94.4 %, 2.4 starts/day.
  - {metric: comfort.in_band_pct, room: wohnzimmer, min: 86}
  - {metric: device.starts_per_day, entity_id: climate.wz_trv, max: 4}
  - {metric: device.valve_travel_per_day, entity_id: climate.wz_trv, max: 10}
  - {metric: device.valve_commands_per_hour, entity_id: climate.wz_trv, max: 3}
