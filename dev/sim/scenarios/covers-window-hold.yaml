name: covers-window-hold
refs: [268, 370]
description: >
  Mid June, bedroom with an inside roller blind that closes at sunset (night close).
  The window is open in the evening past sunset and again at sunrise. With
  covers_window_hold the blind must not go down while the window is open, follow
  once it is closed, and still open at sunrise with the window open. The second
  evening has the window closed: night close as usual.
tags: [covers, window]
start: 2026-06-15T00:00
duration: 2d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate, fixed: {cloud: 30}}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    schlafzimmer:
      floor_area_m2: 16
      exterior_wall_m2: 11
      initial: {temperature: 21.0, mass_temperature: 21.0}
      windows: [{orientation: W, area_m2: 1.8, sensor: binary_sensor.sz_fenster}]
      covers: [{entity_id: cover.sz_rollo, profile: roller_shutter}]
      devices: [{entity_id: climate.sz_trv, profile: generic_trv}]
      sensors:
        temperature: {entity_id: sensor.sz_temp}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
  rooms:
    schlafzimmer:
      devices: [{entity_id: climate.sz_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.sz_temp
      window_sensors: [binary_sensor.sz_fenster]
      climate_mode: heat_only
      comfort_temp: 19.0
      covers: [cover.sz_rollo]
      covers_auto_enabled: true
      covers_night_close: true
      covers_night_position: 0
      covers_window_hold: true
timeline:
  # sunset ~21:33, sunrise ~04:43 local
  - {at: "+0d20h", do: window.open, entity_id: binary_sensor.sz_fenster, for: 3h30m}
  - {at: "+1d04h", do: window.open, entity_id: binary_sensor.sz_fenster, for: 2h}
expect:
  - {invariant: no_rejected_commands}
  - {invariant: no_cover_lowered_over_open_window}
  - {check: "cover('cover.sz_rollo').position > 90", at: "+0d23h00m", label: open window keeps the blind up after sunset}
  - {check: "cover('cover.sz_rollo').position < 10", at: "+0d23h45m", label: night close follows once the window is shut}
  - {check: "cover('cover.sz_rollo').position > 90", at: "+1d05h30m", label: blind opens at sunrise with the window open}
  - {check: "cover('cover.sz_rollo').position < 10", at: "+1d22h30m", label: night close as usual with the window shut}
