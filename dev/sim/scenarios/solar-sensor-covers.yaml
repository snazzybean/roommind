name: solar-sensor-covers
description: >
  Summer, south-facing living room with an exterior venetian blind, a small AC and a sun sensor
  behind the glass and the blind (W/m²). The first two days the automatic shading is off, so the
  sensor learns its scale with the blind open; from day 3 RoomMind shades. A sensor behind the blind
  drops when RoomMind shades: that must neither count the shade twice in the thermal model nor
  lower the sun RoomMind expects (the blind would open, close, open). RoomMind tells from the
  drop that the sensor sits behind the blind.
  --set house.rooms.wohnzimmer.sensors.solar.position=outside for a sensor in front of it (#303).
tags: [covers, solar, sensors, ac]
refs: [303]
start: 2026-07-06T00:00
duration: 5d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: hot-summer}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    wohnzimmer:
      floor_area_m2: 26
      initial: {temperature: 25.0, mass_temperature: 25.0}
      windows: [{orientation: S, area_m2: 6, g_value: 0.6}]
      covers: [{entity_id: cover.wohnzimmer_raffstore, profile: venetian_blind}]
      devices: [{entity_id: climate.wz_ac, profile: generic_split_ac, cool_capacity_w: 1500}]
      sensors:
        temperature: {entity_id: sensor.wz_temp}
        solar: {entity_id: sensor.wz_sonne}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
  rooms:
    wohnzimmer:
      devices: [{entity_id: climate.wz_ac, type: ac}]
      temperature_sensor: sensor.wz_temp
      climate_mode: cool_only
      comfort_cool: 24.5
      eco_cool: 27.0
      covers: [cover.wohnzimmer_raffstore]
      covers_auto_enabled: false
      solar_sensor: sensor.wz_sonne
timeline:
  - {at: "+2d03h", do: roommind.ws, type: roommind/rooms/save, area_id: wohnzimmer, covers_auto_enabled: true}
expect:
  - {invariant: no_rejected_commands}
  - {check: "room.wohnzimmer.solar_sensor.state == 'active'", at: "+2d03h", label: scale learned on the open days}
  - {check: "cover('cover.wohnzimmer_raffstore').position < 90", at: "+3d15h", label: shades in the afternoon}
  # No open-close cycling from a sensor behind the blind (covers-solar-south: 6 moves a day)
  - {metric: cover.max_commands_per_day, entity_id: cover.wohnzimmer_raffstore, max: 6, label: cover moves per day}
  - {check: "room.wohnzimmer.solar_sensor.position == 'inside'", at: "+4d23h", label: sensor found behind the blind}
