name: expected-occupancy-area-occupancy
description: >
  Bathroom without a schedule that takes its comfort window from Area Occupancy Detection
  (mocked get_time_priors: used on weekdays 06:00-08:00, global prior 0.05, automatic
  threshold 0.15). Occupancy eco on with a 15 min delay. The room must sit at eco outside
  its habitual hours and be pre-heated before them, drop to eco when it stays empty in a
  habitual window (counted from the window start) while the next window is still
  pre-heated, and get comfort when it is used outside its window for 5 minutes, held
  until the sensor has been off for 5 minutes. Sunday has no habitual window and gives the
  model a day to learn before the first one.
tags: [trv, presence]
start: 2026-01-11T00:00
duration: 4d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    bad:
      name: Bad
      floor_area_m2: 6
      exterior_wall_m2: 5
      initial: {temperature: 19.0}
      windows: [{orientation: N, area_m2: 0.6}]
      devices:
        # bathroom radiators are sized generously (towel radiator), so a morning lead suffices
        - {entity_id: climate.bad_trv, profile: generic_trv, design_factor: 2.5}
        - {entity_id: climate.kessel, profile: generic_boiler}
      sensors:
        temperature: {entity_id: sensor.bad_temp}
        occupancy: {entity_id: binary_sensor.bad_praesenz}
area_occupancy:
  areas:
    bad:
      global_prior: 0.05
      default: 0.02
      windows:
        - {days: [mon, tue, wed, thu, fri], from: "06:00", to: "08:00", prior: 0.4}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
    compressor_groups:
      - {id: kessel, name: Kessel, members: [climate.bad_trv], master_entity: climate.kessel, min_run_minutes: 5, min_off_minutes: 5}
  rooms:
    bad:
      devices: [{entity_id: climate.bad_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.bad_temp
      occupancy_sensors: [binary_sensor.bad_praesenz]
      occupancy_eco_enabled: true
      occupancy_eco_delay: 15
      use_learned_schedule: true
      learned_occupancy_area_id: bad
      climate_mode: heat_only
      comfort_temp: 21.0
      eco_temp: 17.0
timeline:
  - {at: "+1d06h05m", do: occupancy.set, room: bad, count: 1, for: 25m}
  - {at: "+1d20h00m", do: occupancy.set, room: bad, count: 1, for: 20m}
expect:
  - {invariant: no_rejected_commands}
  - {invariant: target_never_empty}
  - {check: "room.bad.expected_occupancy_threshold == 0.15 and room.bad.expected_comfort_hours == 10.0", at: "+0d01h", label: automatic threshold and comfort hours}
  - {check: "room.bad.target_temp == 17.0", at: "+0d07h00m", label: "Sunday, no habitual window -> eco"}
  - {check: "room.bad.target_temp == 17.0 and room.bad.preheat != null", at: "+1d05h50m", label: pre-heats before the habitual window}
  # eco is 17: the lead the MPC learns in three days gets the room most of the way, not to 21
  - {check: "true_temp('bad') >= 19.0", at: "+1d06h05m", label: well above eco when the window starts}
  - {check: "room.bad.occupancy_vacant == false and room.bad.target_temp == 21.0", at: "+1d06h20m", label: in use in the window -> comfort}
  - {check: "room.bad.occupancy_vacant == true and room.bad.target_temp == 17.0", at: "+1d07h00m", label: left in the window -> eco until it ends}
  - {check: "room.bad.target_temp == 17.0", at: "+1d20h03m", label: short presence outside the window is not confirmed yet}
  - {check: "room.bad.target_temp == 21.0", at: "+1d20h10m", label: used outside the window -> comfort}
  - {check: "room.bad.target_temp == 21.0", at: "+1d20h24m", label: comfort held while the sensor has just gone off}
  - {check: "room.bad.target_temp == 17.0", at: "+1d20h40m", label: released after 5 min off}
  - {check: "room.bad.target_temp == 21.0", at: "+2d06h10m", label: empty window keeps comfort for the delay from its start}
  - {check: "room.bad.occupancy_vacant == true and room.bad.target_temp == 17.0", at: "+2d06h20m", label: empty in the window -> eco}
  - {check: "room.bad.target_temp == 17.0 and room.bad.preheat != null", at: "+3d05h50m", label: next window still pre-heated after an empty one}
  - {check: "true_temp('bad') >= 19.0", at: "+3d06h05m", label: well above eco when the next window starts}
