name: covers-schedule-helper-deleted
refs: [499]
description: >
  Bedroom shutter under night close whose room still lists a force cover schedule
  helper that was deleted in Home Assistant (schedule.geloescht exists neither as
  state nor in the registry). The day starts at noon with the shutter open; at 15:00
  it is closed by hand, so night close finds it already down. A hand-closed shutter
  stays whoever's it was: RoomMind must not open it in the morning. Before the fix
  the missing helper counted as "not loaded yet" for good, so the shutter was taken
  over as if found inside a forced phase after a start and opened in the morning.
tags: [covers]
start: 2026-11-10T12:00
duration: 2d
external_entities: [schedule.geloescht]  # referenced by the room, never created: deleted in HA
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate, fixed: {cloud: 60}}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    schlafzimmer:
      floor_area_m2: 16
      exterior_wall_m2: 11
      initial: {temperature: 19.0, mass_temperature: 19.0}
      windows: [{orientation: S, area_m2: 1.8}]
      covers: [{entity_id: cover.sz_rollo, profile: roller_shutter}]
      devices: [{entity_id: climate.sz_trv, profile: generic_trv}]
      sensors:
        temperature: {entity_id: sensor.sz_temp}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
  rooms:
    schlafzimmer:
      devices: [{entity_id: climate.sz_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.sz_temp
      climate_mode: heat_only
      comfort_temp: 19.0
      covers: [cover.sz_rollo]
      covers_auto_enabled: true
      covers_night_close: true
      covers_night_position: 0
      cover_schedules: [{entity_id: schedule.geloescht, mode: force}]
timeline:
  - {at: "+0d03h", do: ha.service, service: cover.close_cover, data: {entity_id: cover.sz_rollo}}
expect:
  - {invariant: no_rejected_commands}
  - {check: "cover('cover.sz_rollo').position > 90", at: "+0d02h50m", label: open before the hand close}
  - {check: "cover('cover.sz_rollo').position < 10", at: "+0d06h00m", label: down at night}
  - {check: "cover('cover.sz_rollo').position < 10", at: "+0d23h00m", label: hand-closed shutter stays closed in the morning}
  - {metric: cover.max_commands_per_day, entity_id: cover.sz_rollo, max: 2, label: no extra moves}
