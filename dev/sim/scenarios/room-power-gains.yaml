name: room-power-gains
description: >
  Two identical home offices, each with a 400 W PC on weekdays 09-17, a fridge (80 W all
  the time) and a dishwasher (2 kW for 90 min every evening, only 5 % of it stays in the
  room as heat). Buero meters all three with power sensors assigned in RoomMind,
  Arbeitszimmer runs the same devices unmetered. RoomMind learns per sensor: the PC
  measurably improves the prediction and is used, the fridge never leaves its usual load
  and the dishwasher's power does not show up in the room, so both stay "no effect".
  The benefit shows against the unmetered twin: a smaller prediction error and less
  overshoot while the PC runs, and the constant fridge does not hold up the heating rate.
tags: [ekf, mpc, power]
start: 2026-01-12T00:00
duration: 21d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    buero:
      floor_area_m2: 14
      initial: {temperature: 19.0}
      devices: [{entity_id: climate.bu_trv, profile: generic_trv}]
      sensors:
        temperature: {entity_id: sensor.bu_temp}
        power_pc: {entity_id: sensor.bu_pc_power}
        power_fridge: {entity_id: sensor.bu_fridge_power}
        power_dishwasher: {entity_id: sensor.bu_dishwasher_power}
    arbeitszimmer:
      floor_area_m2: 14
      initial: {temperature: 19.0}
      devices: [{entity_id: climate.az_trv, profile: generic_trv}]
      sensors:
        temperature: {entity_id: sensor.az_temp}
helpers:
  schedule:
    plan_buero: {weekdays: ["08:00-18:00"], weekend: []}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
  rooms:
    buero:
      devices: [{entity_id: climate.bu_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.bu_temp
      power_sensors: [sensor.bu_pc_power, sensor.bu_fridge_power, sensor.bu_dishwasher_power]
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan_buero}]
      comfort_temp: 21.0
      eco_temp: 18.0
    arbeitszimmer:
      devices: [{entity_id: climate.az_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.az_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan_buero}]
      comfort_temp: 21.0
      eco_temp: 18.0
