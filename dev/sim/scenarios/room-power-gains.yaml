  # RoomMind's own backtest of each room at the end: its one-hour prediction error
  - {at: "+20d23h50m", do: roommind.ws, type: roommind/analytics/get, area_id: buero}
  - {at: "+20d23h50m", do: roommind.ws, type: roommind/analytics/get, area_id: arbeitszimmer}
expect:
  - {metric: model.power_bu_pc_power_active, room: buero, min: 1, label: the PC improves the prediction and is used}
  - {metric: model.power_bu_pc_power_improvement, room: buero, min: 0.2, label: the PC removes a fifth of the prediction error or more (28 %)}
  - {metric: model.power_bu_pc_power_ratio, room: buero, min: 0.6, max: 1.4, label: PC heat learned near the truth}
  - {metric: model.power_bu_fridge_power_no_effect, room: buero, min: 1, label: the constant fridge shows no effect}
  - {metric: model.power_bu_fridge_power_windows, room: buero, max: 0, label: the constant fridge never moves the learner}
  - {metric: model.power_bu_dishwasher_power_active, room: buero, max: 0, label: the dishwasher's power is not used}
  # The twins differ a little without any sensor too (backtest ratio 0.81 with no power sensor in Buero)
  - {metric: model.backtest_idle_mae, room: buero, vs_room: arbeitszimmer, max: 0.75, label: smaller backtest error than the unmetered twin}
  - {metric: room.overshoot_kh, room: buero, vs_room: arbeitszimmer, max: 1.0, label: no more overshoot than the unmetered twin}
  - {invariant: target_never_empty}
