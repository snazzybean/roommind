name: trv-setpoint-restored-after-switch-on
description: >
  Bedroom with a TRV that falls back to its own setpoint a few seconds after RoomMind
  switches it on (tado X over Matter shows 5 °C again right after "heat, 29 °C"). The
  proportional setpoint dwell held the boost for five minutes although the device no longer
  had it, so every run started with a cold radiator. RoomMind must send it again soon.
tags: [trv, mpc, device-quirk]
start: 2026-01-12T00:00
duration: 3d
location: {latitude: 52.5, longitude: 13.4, time_zone: Europe/Berlin}
weather: {profile: temperate}
house:
  building: bestand_teilsaniert
  outdoor: {sensors: {temperature: sensor.aussen_temp}}
  rooms:
    schlafzimmer:
      name: Schlafzimmer
      floor_area_m2: 16
      exterior_wall_m2: 11
      initial: {temperature: 18.0}
      windows: [{orientation: N, area_m2: 1.8}]
      devices:
        - {entity_id: climate.schlafzimmer_trv, profile: tado_x_matter}
        - {entity_id: climate.heizung_kessel, profile: generic_boiler}
      sensors:
        temperature: {entity_id: sensor.schlafzimmer_temp}
helpers:
  schedule:
    plan: {weekdays: ["06:30-15:00"], weekend: ["06:30-15:00"]}
roommind:
  settings:
    outdoor_temp_sensor: sensor.aussen_temp
    weather_entity: weather.simhome
    control_mode: mpc
    compressor_groups:
      - {id: kessel, name: Kessel, members: [climate.schlafzimmer_trv], master_entity: climate.heizung_kessel, min_run_minutes: 5, min_off_minutes: 5}
  rooms:
    schlafzimmer:
      devices: [{entity_id: climate.schlafzimmer_trv, type: trv, heating_system_type: radiator}]
      temperature_sensor: sensor.schlafzimmer_temp
      climate_mode: heat_only
      schedules: [{entity_id: schedule.plan}]
      comfort_temp: 19.0
      eco_temp: 16.0
expect:
  - {invariant: no_rejected_commands}
  # v1.8.2: 1.28 h in 3 d (the boost waited out the 300 s dwell on every switch-on); now
  # ~1 min per run while RoomMind waits for the device to report the value back
  - {metric: device.setpoint_lost_h, entity_id: climate.schlafzimmer_trv, max: 0.5}
  # one extra frame per switch-on, not one per cycle (1.46/h after the fix, 1.18 in v1.8.2)
  - {metric: device.commands_per_hour, entity_id: climate.schlafzimmer_trv, max: 1.8}
