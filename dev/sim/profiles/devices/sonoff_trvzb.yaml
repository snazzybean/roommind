description: SONOFF TRVZB via Zigbee2MQTT; rejects 0 as a setpoint (#162).
extends: generic_trv
# valve_numbers: number.<object_id>_valve_opening_degree / _valve_closing_degree (0-100 %, default 100),
# as Zigbee2MQTT exposes them; 100/100 = the TRV's own control unchanged.
capabilities: {min_temp: 4, max_temp: 35, valve_numbers: true}
quirks:
  - {type: reject_values, values: [0], message: "Invalid value 0 for timer_mode_target_temp"}
  - {type: availability, unavailable_after_start_s: 40}
