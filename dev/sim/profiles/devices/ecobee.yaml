description: Ecobee controlling a central heat pump in °F with heat_cool range (#277, #22).
model: heat_pump
capabilities:
  hvac_modes: ["off", "heat", "cool", "heat_cool"]
  min_temp: 45
  max_temp: 92
  target_temp_step: 1
  unit: F
  range_setpoint: true
params:
  heat_capacity_w: 8000
  cool_capacity_w: 7000
  hysteresis_k: 0.5
  min_run_s: 300
  cop_heat: [2.8, 0.05]
  eer: 3.2
  shr: 0.7
  serves_rooms: []             # extra rooms reached by the ducts, with equal split
quirks:
  - {type: rounding, whole_degrees: true}
