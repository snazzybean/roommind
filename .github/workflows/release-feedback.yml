name: Release Feedback

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose notes are scanned
        required: true
      dry_run:
        description: Only log what would be posted
        type: boolean
        default: true

jobs:
  request-feedback:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      discussions: write
      contents: read
    steps:
      - name: Ask reporters of fixed issues to test, close implemented discussions
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = context.eventName === 'workflow_dispatch' && String(context.payload.inputs.dry_run) !== 'false';
            const release = context.eventName === 'release'
              ? context.payload.release
              : (await github.rest.repos.getReleaseByTag({ owner, repo, tag: context.payload.inputs.tag })).data;
            const prerelease = release.prerelease || /-(alpha|beta|rc)\b/.test(release.tag_name);

            // Issues and discussions share one number space; the number decides, not the link path.
            const pattern = new RegExp(`github\\.com/${owner}/${repo}/(?:issues|discussions)/(\\d+)`, 'g');
            const numbers = [...new Set([...(release.body || '').matchAll(pattern)].map(m => Number(m[1])))];
            core.info(`${release.tag_name}: referenced ${numbers.join(', ') || 'none'}`);

            const base = release.tag_name.replace(/-(alpha|beta|rc)\b.*$/, '');
            const escaped = base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const cycleLink = new RegExp(`releases/tag/${escaped}(?:-(?:alpha|beta|rc)[0-9A-Za-z.]*)?(?![0-9A-Za-z.])`);
            const releaseLink = `[${release.tag_name}](${release.html_url})`;

            async function handleIssue(issue, number) {
              const labels = issue.labels.map(l => l.name);
              if (issue.pull_request || issue.state !== 'open') {
                core.info(`#${number}: skipped (${issue.pull_request ? 'pull request' : 'closed'})`);
                return;
              }
              // Set by an earlier release of the same fix (beta before final).
              if (labels.includes('fix-released')) {
                core.info(`#${number}: skipped (already notified)`);
                return;
              }
              // A reply drops fix-released; a beta of this version already asked, the final must not
              // ask again and take needs-attention away from a "still broken" answer.
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number });
              if (comments.some(c => cycleLink.test(c.body || ''))) {
                core.info(`#${number}: skipped (notified for ${base} already)`);
                return;
              }
              const body = `${releaseLink} includes a fix for this. Please update and comment here whether it works for you.`;
              if (dryRun) {
                core.info(`#${number}: would comment "${body}"`);
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['waiting for feedback', 'fix-released'] });
              for (const name of ['stale', 'needs-attention']) {
                if (labels.includes(name)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name });
                }
              }
              core.info(`#${number}: commented and labeled`);
            }

            async function handleDiscussion(number) {
              const { repository } = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    discussion(number: $number) {
                      id closed locked
                      labels(first: 20) { nodes { name } }
                      comments(last: 100) { nodes { body } }
                    }
                  }
                }`,
                { owner, repo, number },
              );
              const d = repository.discussion;
              // A beta is not what most people install; the stable release closes the request.
              if (prerelease) {
                core.info(`#${number}: skipped (discussion, prerelease)`);
                return;
              }
              if (d.closed || d.locked) {
                core.info(`#${number}: skipped (discussion ${d.closed ? 'closed' : 'locked'})`);
                return;
              }
              // Also covers a request reopened with /reopen after this release closed it.
              if (d.comments.nodes.some(c => cycleLink.test(c.body || ''))) {
                core.info(`#${number}: skipped (discussion, ${base} already posted)`);
                return;
              }
              const keepOpen = d.labels.nodes.some(l => l.name === 'keep-open');
              const body = keepOpen
                ? `${releaseLink} includes part of this. This discussion stays open for the rest.`
                : `${releaseLink} includes this, so this discussion is closed. If something is still missing, comment here. If you opened it, include \`/reopen\` in your comment and it opens again.`;
              if (dryRun) {
                core.info(`#${number}: would ${keepOpen ? 'comment (keep-open)' : 'comment and close'} "${body}"`);
                return;
              }
              await github.graphql(
                `mutation($id: ID!, $body: String!) { addDiscussionComment(input: { discussionId: $id, body: $body }) { comment { id } } }`,
                { id: d.id, body },
              );
              if (keepOpen) {
                core.info(`#${number}: commented (keep-open)`);
                return;
              }
              await github.graphql(
                `mutation($id: ID!) { closeDiscussion(input: { discussionId: $id, reason: RESOLVED }) { discussion { id } } }`,
                { id: d.id },
              );
              core.info(`#${number}: commented and closed`);
            }

            const failed = [];
            for (const number of numbers) {
              try {
                let issue = null;
                try {
                  ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
                if (issue) {
                  await handleIssue(issue, number);
                } else {
                  await handleDiscussion(number);
                }
              } catch (e) {
                // One bad link must not keep the remaining reporters from hearing about the release.
                core.warning(`#${number}: ${e.message}`);
                failed.push(number);
              }
            }
            if (failed.length) core.setFailed(`Failed for ${failed.map(n => `#${n}`).join(', ')}`);
