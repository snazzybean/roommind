name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=custom_components/roommind --cov-report=term --cov-fail-under=95

      - name: Coverage badge
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  timezone-sweep:
    name: TZ sweep (OS=${{ matrix.os_tz }}, HA=${{ matrix.ha_tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sweep the schedule-resolution tests across host-OS × HA timezone
        # permutations.
        os_tz: ["UTC", "US/Pacific", "Australia/Sydney"]
        ha_tz: ["UTC", "US/Pacific", "Australia/Sydney"]
    env:
      TZ: ${{ matrix.os_tz }} # host/OS timezone (naive datetime, libc)
      ROOMMIND_TEST_TZ: ${{ matrix.ha_tz }} # HA's configured timezone (dt_util)
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Schedule-resolution timezone tests
        # asyncio_mode is passed explicitly because this branch's base has no
        # pytest asyncio config; matches how the suite is run elsewhere.
        # Only the pure schedule-resolution tests are swept across HA timezones.
        # MPC/solar tests are deliberately excluded: their decisions depend on
        # the absolute instant (sun position), so pinning a local wall clock
        # while sweeping the HA zone changes the *correct* answer — that is not a
        # timezone-correctness bug.
        run: pytest tests/utils/test_schedule_utils.py -v -o asyncio_mode=auto

  frontend:
    name: Frontend type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npx eslint src/

      - name: Prettier check
        working-directory: frontend
        run: npx prettier --check src/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install Python tools
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check custom_components/ tests/

      - name: Ruff format check
        run: ruff format --check custom_components/ tests/

      - name: mypy
        run: mypy custom_components/roommind/

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
